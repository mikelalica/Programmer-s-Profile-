<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mike Lalica | Network Development Management, NVSU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F6;--ink:#101B33;--mute:#53607A;--line:#C5CEDC;--sig:#1D4FFF;--pkt:#FF8A00;--panel:#F8FAFC;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1526;--ink:#E8EEF9;--mute:#93A1BD;--line:#26324D;--sig:#6C93FF;--pkt:#FFB347;--panel:#141D33}}
:root[data-theme="dark"]{--bg:#0E1526;--ink:#E8EEF9;--mute:#93A1BD;--line:#26324D;--sig:#6C93FF;--pkt:#FFB347;--panel:#141D33}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--sig);outline-offset:3px;border-radius:4px}

/* Cable rail: scroll progress and navigation */
#rail{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:16vh;bottom:16vh;width:28px;z-index:5}
#rail .track{position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
#rail .fill{position:absolute;left:13px;top:0;width:2px;height:calc(var(--p,0)*100%);background:var(--sig)}
#rail .pkt{position:absolute;left:8px;top:calc(var(--p,0)*100%);width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--pkt);box-shadow:0 0 0 5px color-mix(in srgb,var(--pkt) 25%,transparent)}
#rail button{position:absolute;left:6px;width:16px;height:16px;margin-top:-8px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--bg);cursor:pointer;transition:border-color .2s,background .2s}
#rail button.on{border-color:var(--sig);background:var(--sig)}
#rail button span{position:absolute;left:28px;top:50%;transform:translateY(-50%);font:500 13px var(--body);color:var(--mute);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
#rail button:hover span,#rail button:focus-visible span,#rail button.on span{opacity:1}
#rail button.on span{color:var(--ink)}

.wrap{max-width:900px;margin-left:clamp(56px,11vw,180px);padding-right:24px}
section{padding-block:clamp(72px,13vh,150px)}
